version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      semver-patch-days: 30
      semver-minor-days: 60
      semver-major-days: 90
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      semver-patch-days: 30
      semver-minor-days: 60
      semver-major-days: 90
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      semver-patch-days: 30
      semver-minor-days: 60
      semver-major-days: 90
